<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yoxi City-Grid 迷霧地圖</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
        #map { width: 100vw; height: 100vh; }
        
        /* 升級：毛玻璃科技感 UI 面板 */
        .glass-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(230, 0, 18, 0.4);
            padding: 24px; border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 1; width: 340px; color: #fff;
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;}
        .header h3 { margin: 0; color: #fff; font-size: 1.3em; letter-spacing: 1px; display: flex; align-items: center;}
        .header h3::before { content: ''; display: inline-block; width: 10px; height: 10px; background: #e60012; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 8px #e60012;}
        
        .tag-container { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: rgba(230, 0, 18, 0.15); color: #ff4d4d; border: 1px solid rgba(230, 0, 18, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold;}
        
        /* 升級：遊戲化進度條 */
        .progress-section { margin: 15px 0; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .progress-bar-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 5px;}
        .progress-bar-fill { width: 35%; height: 100%; background: linear-gradient(90deg, #e60012, #ff4d4d); }
        
        .reward-text { font-size: 1.2em; color: #ffd700; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center;}
        
        .fav-btn {
            width: 100%; padding: 12px; background: transparent; border: 2px solid #e60012; color: #fff; 
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; font-size: 1em; text-transform: uppercase; letter-spacing: 1px;
        }
        .fav-btn:hover { background: #e60012; box-shadow: 0 0 15px rgba(230,0,18,0.5); }
    </style>
</head>
<body>
    <div class="glass-panel" id="task-info">
        <div class="header">
            <h3>系統連線中...</h3>
        </div>
        <p style="color: #aaa;">正在啟動 AI 空間探測雷達</p>
    </div>
    
    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', 
            center: [121.5654, 25.0330], 
            zoom: 13.5
        });

        map.on('load', async () => {
            map.addSource('city-grids', {
                'type': 'geojson',
                'data': {
                    "type": "FeatureCollection",
                    "features": [{
                        "type": "Feature",
                        "properties": { "unlocked": false },
                        "geometry": {
                            "type": "Polygon",
                            "coordinates": [[[121.55, 25.02], [121.58, 25.02], [121.58, 25.05], [121.55, 25.05], [121.55, 25.02]]]
                        }
                    }]
                }
            });

            map.addLayer({
                'id': 'fog-layer',
                'type': 'fill',
                'source': 'city-grids',
                'paint': {
                    'fill-color': ['case', ['boolean', ['get', 'unlocked'], false], 'transparent', '#000000'],
                    'fill-opacity': 0.8,
                    'fill-outline-color': '#e60012'
                }
            });

            try {
                const response = await fetch('http://localhost:3000/api/tasks/generate');
                const result = await response.json();
                
                if(result.status === 'success') {
                    const task = result.data[0];
                    const tagsHtml = task.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                    
                    document.getElementById('task-info').innerHTML = `
                        <div class="header">
                            <h3>yoxi 拓荒任務</h3>
                            <span style="background:#e60012; padding:2px 8px; border-radius:4px; font-size:0.7em;">限時</span>
                        </div>
                        <p style="font-size: 1.1em; line-height: 1.5; color: #ddd;">${task.description}</p>
                        <div class="tag-container">${tagsHtml}</div>
                        
                        <div class="progress-section">
                            <div style="display:flex; justify-content:space-between; font-size:0.85em; color:#aaa;">
                                <span>本週城市探索進度</span>
                                <span style="color:#fff;">35%</span>
                            </div>
                            <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
                        </div>
                        
                        <div class="reward-text">💰 獎勵：${task.reward} 乘車金</div>
                        <button id="fav-btn" class="fav-btn">🤍 鎖定任務 (加入願望)</button>
                    `;

                    document.getElementById('fav-btn').addEventListener('click', async (e) => {
                        const btn = e.target;
                        try {
                            const favResponse = await fetch('http://localhost:3000/api/places/favorite', { method: 'POST' });
                            const favResult = await favResponse.json();
                            if(favResult.status === 'success') {
                                btn.innerHTML = '🎯 已鎖定任務目標';
                                btn.style.background = '#e60012';
                                btn.style.color = '#fff';
                                alert(favResult.message);
                            }
                        } catch (err) {
                            alert('網路異常，請確認伺服器狀態。');
                        }
                    });
                }
            } catch (error) {
                document.getElementById('task-info').innerHTML = `<p style="color:#ff4d4d;">連線至 yoxi 核心失敗</p>`;
            }
        });
    </script>
</body>
</html>
